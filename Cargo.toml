[package]
name = "openvariant-core"
version = "2.0.0"
edition = "2024"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28.3", features = ["extension-module"] }
regex = "1.13.1"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2"
yaml_serde = "0.10.4"
